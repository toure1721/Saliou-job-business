<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facture simple</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#dbe9e0;--paper:#f7fbf8;--ink:#07140d;--mute:#26372d;--line:#bcd3c6;--acc:#0b3d27;--acc-ink:#fff;--field:#e8f1eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;white-space:nowrap;background:var(--bg);color:var(--ink);font:700 18px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{max-width:820px;margin:0 auto;padding:16px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar h1{font-size:18px;margin:0 auto 0 0;font-weight:700}
button,select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;cursor:pointer}
button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{max-width:820px;margin:8px auto 0;padding:0 16px;color:var(--mute);min-height:1em;overflow-x:auto}
.sheet{max-width:820px;overflow-x:auto;margin:12px auto 32px;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:6px;padding:clamp(18px,5vw,48px)}
input,textarea,select.f{font:inherit;color:inherit;background:var(--field);border:1.5px solid var(--acc);border-radius:6px;padding:7px 9px;width:100%}
select{border:1.5px solid var(--acc)}
input[type=range],input[type=checkbox]{border:0}
input:hover,textarea:hover,select:hover{border-color:var(--ink)}
textarea{resize:vertical;min-height:64px;white-space:pre;overflow:auto}
::placeholder{color:#4d5d54;font-weight:500}
[hidden]{display:none!important}
#invoice #co,#invoice #by,#invoice label[for="by"],#invoice .notes,#invoice #num,#invoice label[for="num"],#invoice #status,#invoice label[for="status"]{display:none}
.bar{gap:6px}.bar select{flex:1 1 100%;font-weight:700;border-radius:4px;padding:12px 16px}
.bar button,.add,#pick,#pickSign,#signDraw,#rmlogo,#rmSign,#stadd,.sc button,.ha button,.ctl button.sz{background:var(--acc);color:#fff;border:0;border-radius:4px;font-weight:700;text-align:center}
.bar button,.add,#pick,#pickSign,#signDraw,#rmlogo,#rmSign,#stadd,.sc button{display:block;width:100%;padding:12px 16px}
.bar button.main,#pick,#signDraw,#stadd{background:#c8600c}
.ha button:nth-child(2){background:#b36a12}.ha button:nth-child(3){background:#8a3a08}
.add{margin-top:12px}.logobox>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.hint,#msg,.co,.coinfo,.coname,.pick span,.sc label,.grid label,.cl label,.notes label,.hs .cu,.lp,#sthint,#doc .bx>div,#doc .dc,#doc .wd,#doc .ca{white-space:normal;overflow-wrap:anywhere}
#msg{overflow-x:visible}
#history td{white-space:nowrap;overflow-wrap:normal}
.top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.top h2{font-size:40px;line-height:1;margin:0 0 12px;letter-spacing:-.02em;color:var(--acc)}
.meta{display:grid;grid-template-columns:minmax(200px,260px);gap:4px;color:var(--mute)}.meta label{display:block;font-weight:700;margin-top:10px}.meta label[for="date"]{margin-top:0}
.logo{display:block;max-height:64px;max-width:200px;margin-bottom:10px}
.coname{font-weight:700;font-size:17px}
.coinfo{white-space:pre-line;color:var(--mute)}
.co a{color:var(--acc);font-weight:700}
.cl{margin:26px 0;max-width:380px}
.cl label{display:block;font-weight:700;margin-bottom:6px}
.cl input{margin-bottom:6px}
.scroll{overflow-x:auto}
table.f{width:100%;border-collapse:collapse;min-width:780px}
.f th{text-align:left;font-weight:700;color:var(--mute);font-size:15px;padding:8px 6px;border-bottom:2px solid var(--acc)}
.f td{padding:6px 4px;border-bottom:1px solid var(--line)}
.rf{width:84px}.q{width:76px}.p{width:120px}.t{width:120px;text-align:right;font-variant-numeric:tabular-nums;padding-right:6px}.x{width:36px}
.f th.t{text-align:right}
.rm{padding:4px 8px;border:none;background:none;color:var(--mute);font-size:18px}
.add{margin-top:10px}
.tot{margin:24px 0 0 auto;max-width:360px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.tot .v{text-align:right;font-variant-numeric:tabular-nums}
.tot .grand{font-size:20px;font-weight:700;padding-top:10px;border-top:2px solid var(--acc)}
.tot input{width:70px;text-align:right;display:inline-block}
.tot #acompte{width:120px}
.notes{margin-top:28px}
.pb{display:flex;gap:8px;flex-wrap:wrap}.pb button.pi{width:130px;height:96px;padding:6px;background:#fff;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}.pb button.pi img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}.pb button.pi.on{border:4px solid var(--acc);padding:4px;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.notes label{font-weight:700;display:block;margin-bottom:6px}
.sh{font-size:26px;margin:0 0 6px;color:var(--acc)}
.hint{color:var(--mute);margin:0 0 22px}
.logobox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.lp{width:160px;height:90px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden}
.lp img{max-width:100%;max-height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid .full{grid-column:1/-1}
.grid label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.grid input,.grid textarea,.grid select{font-weight:700}
.grid select{width:100%;background:var(--field)}
.grid h3{grid-column:1/-1;margin:12px 0 0;font-size:17px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

/* Document A4 (utilisé pour le PDF, hors écran) */
#doc{--g:#0b3d27;--o:#c8600c;--gd:#b36a12;--r:#c8600c;position:relative;transform-origin:0 0;width:794px;min-height:1123px;background:#fff;color:#000;padding:34px 40px 26px;display:flex;flex-direction:column;font:700 17px/1.4 "Public Sans",system-ui,"Segoe UI",sans-serif}
#doc .st{display:grid;gap:3px}#doc .st i{display:block;height:5px}
#doc .st i:nth-child(1){background:var(--g)}#doc .st i:nth-child(2){background:var(--gd)}#doc .st i:nth-child(3){background:var(--r)}
#doc .dh{display:flex;align-items:center;gap:14px;margin:14px 0 8px}
#doc .dh img{width:72px;max-height:72px;object-fit:contain}
#doc .dc{flex:1}
#doc .cn{font-size:30px;font-weight:700;color:var(--g);line-height:1.1;text-transform:uppercase}
#doc .ca{font-weight:700;margin-top:6px;white-space:normal}
#doc .dr{text-align:right}
#doc .ft{font-size:34px;font-weight:700;color:var(--g);line-height:1}
#doc .fn{color:var(--o);font-weight:700;font-size:19px;margin:4px 0}
#doc .bd{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:4px;padding:1px 9px;font-weight:700;font-size:16px;margin-top:6px}
#doc .rule{border-top:2px solid var(--g);margin:6px 0 14px}
#doc .bx{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
#doc .bx>div{border:1.5px solid var(--g);border-radius:6px;padding:8px 10px;line-height:1.55}
#doc h4{margin:0 0 3px;color:var(--g);font-size:16px;letter-spacing:.04em}
#doc .tw{flex:1;display:flex;border:2px solid var(--g);margin-bottom:12px}
#doc .dt{width:100%;height:100%;border-collapse:collapse}
#doc .dt th{background:var(--g);color:#fff;padding:6px 6px;font-size:16px;border:1px solid var(--g)}
#doc .dt td{padding:4px 6px;border:1px solid var(--g)}
#doc .dt tr.fill td{height:100%;background:#fff}
#doc .dt td:first-child,#doc .dt th:first-child{border-left:0}#doc .dt td:last-child,#doc .dt th:last-child{border-right:0}#doc .dt tbody tr:last-child td{border-bottom:0}#doc .dt thead th{border-top:0}
#doc .dt td:nth-child(3),#doc .ty,#doc .ff span:first-child,#doc .bx>div div{white-space:normal}#doc .c{text-align:center}#doc .b{font-weight:700}#doc .n{text-align:right;white-space:nowrap}
#doc .sm{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
#doc .wd{flex:1;border:1.5px solid var(--g);border-radius:6px;padding:8px 10px}
#doc .wd h4{margin:0 0 2px}#doc .wd i{font-weight:700;white-space:normal}
#doc .tt{width:370px;border:2px solid var(--g);border-radius:6px;overflow:hidden}
#doc .tt div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px}
#doc .tt .g{background:var(--g);color:#fff;font-weight:700;font-size:19px}
#doc .tt .ac{color:var(--o);font-weight:600}
#doc .tt .so{background:var(--o);color:#fff;font-weight:700;font-size:19px}
#doc .sg{display:flex;gap:24px;margin:6px 0 60px}
#doc .sg div{flex:1;color:var(--g);font-weight:700;font-size:16px}
#doc .sg div:after{content:"";display:block;height:34px;border-bottom:1.5px solid #111}
#doc .ff{border-top:2px solid var(--g);padding-top:8px;display:flex;justify-content:space-between;gap:20px;font-size:15px;font-weight:700;margin-bottom:8px}
#doc .ff span:last-child{white-space:nowrap}
#doc .ty{color:var(--g);font-weight:700;font-size:15px;margin-top:-4px;margin-bottom:8px}
#doc .stp{position:absolute;cursor:move;touch-action:none;user-select:none;-webkit-user-drag:none}#doc .stp.on{outline:2px dashed #c8600c;outline-offset:2px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.cb{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}.cb.sel{box-shadow:0 0 0 3px var(--ink)}#szr{width:160px;padding:0;background:none}.ctl button.sz{width:38px;padding:6px 0;font-weight:700}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pick label{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;font-size:13px;text-align:center;min-width:104px}.pick label:has(input:checked){border-color:var(--acc);background:var(--field)}.pick img{width:72px;height:72px}.pick input{width:auto}
.sc{display:grid;grid-template-columns:96px 1fr;gap:14px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}.sc img{width:96px;height:96px}.sc .fl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.sc label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:14px;width:100%}.sc textarea{min-height:56px}
@media(max-width:600px){.sc{grid-template-columns:1fr}}
#pvwrap{width:100%}.pv{padding:clamp(12px,3vw,24px)}
#history table.f{border-collapse:separate;border-spacing:0 4px}#history .f thead th{background:var(--acc);color:#fff;border:0;padding:11px 10px;font-size:14px}#history .f thead th:first-child,#history .f tbody td:first-child{border-radius:4px 0 0 4px}#history .f thead th:last-child,#history .f tbody td:last-child{border-radius:0 4px 4px 0}#history .f tbody td{border:0;padding:11px 10px}#history .f tbody tr:nth-child(odd) td{background:#dcebe2}#history .f tbody tr:nth-child(even) td{background:#f1e9cf}
.hs{display:flex;flex-direction:column;gap:4px;margin:0 0 18px}.hs div{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--acc);color:#fff;padding:11px 16px;border-radius:4px}.hs b{font-size:20px}.hs small{color:#fff;font-size:16px;font-weight:700}.hs .cu{background:none;color:var(--acc);padding:0 0 2px;font-size:18px;font-weight:700}.hs div:nth-child(4){background:#b36a12}.hs div:nth-child(5){background:#c8600c}.ha{white-space:nowrap}.ha button{padding:5px 10px;font-size:14px;margin:2px 4px 2px 0}.pd{color:var(--acc);font-weight:700}.np{color:#c8600c;font-weight:700}
.tabs{display:flex;gap:6px;margin-top:16px}.tabs button{flex:1;padding:12px 16px;border-radius:4px 4px 0 0;border:0;background:var(--field);color:var(--ink);font-weight:700}.tabs button.on{background:var(--acc);color:#fff}
.pane{display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--acc);padding-top:12px}#paneShare button{display:block;width:100%;padding:14px 16px;background:var(--acc);color:#fff;border:0;border-radius:4px;font-weight:700;text-align:center}#paneShare button.main{background:#c8600c}#paneShare button:disabled{opacity:.6}
/* Interface compacte : moins d'espaces vides (le document PDF #doc n'est pas touché) */
body{line-height:1.35}
.bar{padding:8px 8px 0;gap:4px}.bar button,.add,#pick,#pickSign,#signDraw,#rmlogo,#rmSign,#stadd,.sc button{padding:10px 14px}.bar select{padding:10px 14px}
#msg{margin:4px auto 0;padding:0 8px;min-height:0}#msg:empty{display:none}
.sheet{margin:6px auto 8px;padding:10px 12px;border-top-width:4px}.pv{padding:6px}
input,textarea,select.f{padding:5px 8px}textarea{min-height:48px}
.top{gap:8px}.top h2{margin:0 0 4px}.meta{gap:2px}.meta label{margin-top:4px}.logo{margin-bottom:4px}
.cl{margin:10px 0}.cl label{margin-bottom:2px}.cl input{margin-bottom:2px}
.f th{padding:6px 4px}.f td{padding:3px 4px}.add{margin-top:6px}
.tot{margin:10px 0 0 auto;gap:4px 12px}.tot .grand{padding-top:6px}
.notes{margin-top:10px}.notes label{margin-bottom:2px}
.sh{margin:0 0 4px}.hint{margin:0 0 8px}.logobox{margin-bottom:10px;gap:10px}
.grid{gap:8px}.grid h3{margin:6px 0 0}.grid label{gap:2px}
.hs{margin:0 0 8px}.hs div{padding:8px 14px}
#hq{margin-top:8px!important;margin-bottom:6px!important}
#history .f thead th{padding:8px 10px}
#pvwrap{margin-top:0!important}#stpick{margin-top:6px!important}.pick{margin-top:4px;gap:6px}.ctl{margin-top:8px}
.sc{margin:6px 0;padding:8px;gap:10px}.sc .fl{gap:4px}
.pane{padding-top:6px}
#history table.f{border-spacing:0}#history .f tbody tr:nth-child(odd) td,#history .f tbody tr:nth-child(even) td{background:transparent;border-bottom:1px solid var(--line)}#history .f thead th,#history .f tbody td:first-child,#history .f tbody td:last-child{border-radius:0}
#history table.f{border-collapse:collapse;border:1.5px solid var(--acc)}#history .f th,#history .f td{border:1px solid var(--acc)!important}#history .f thead th{border-color:#fff!important}#history .f tbody td{padding:9px 10px}
.ha button.rg{background:#c8600c!important}.ha button.dl{background:#8a3a08!important}
.ha .pp{display:flex;flex-direction:column;gap:4px;margin-top:4px;min-width:130px}.ha .pp input{width:100%;text-align:right}.ha .pp button{background:var(--acc)!important;color:#fff}.ha .pp button:last-child{background:#6b7a72!important}
#doc .sg div{position:relative}#doc .sig:after{height:70px!important}#doc .sgi{position:absolute;left:0;bottom:4px;height:auto;max-height:62px;max-width:200px;width:auto;object-fit:contain;object-position:left bottom}
#signPad{margin:6px 0}#sgc{display:block;width:100%;height:auto;background:#fff;border:1.5px dashed var(--acc);border-radius:6px;touch-action:none;cursor:crosshair}#signPad .r{display:flex;gap:6px;margin-top:6px}#signPad button{flex:1;padding:10px 12px;background:var(--acc);color:#fff;border:0;border-radius:4px;font-weight:700;white-space:normal}#signPad button.gr{background:#6b7a72}
.pb{flex-wrap:nowrap;gap:6px}.pb button.pi{flex:1 1 0;min-width:0;width:auto;height:84px}
.pb button.pi{height:auto;min-height:48px;padding:10px 6px;font-weight:700;font-size:16px;line-height:1.2;white-space:normal;text-align:center;color:var(--ink)}.pb button.pi.on{padding:8px 4px;background:var(--acc);color:#fff}
.sheet{border-top-color:#c8600c}.tot .grand{border-top-color:#c8600c}.f th{border-bottom-color:#c8600c}.top h2,.sh{color:var(--acc)}.sh{border-bottom:3px solid #c8600c;padding-bottom:4px;margin-bottom:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline-color:#c8600c}
.bar button.main,#pick,#signDraw,#stadd,#sv{background:#c8600c}
#pvwrap{overflow:hidden}.sheet.pv{overflow-x:hidden}html,body{overflow-x:hidden}
#doc .cn,#doc .bx b{color:#000;font-weight:900;-webkit-text-stroke:.6px #000}#doc .bx b{font-size:19px}
#doctype{font-size:24px;font-weight:700;color:var(--acc);padding:6px 10px;margin:0 0 6px;width:auto;max-width:100%}#doc .dr{white-space:normal}
/* Champs plus bas : hauteur fixe ~30 px, texte 16 px */
input:not([type=checkbox]):not([type=range]):not([type=file]):not([type=radio]),select.f,.grid select{font-size:16px;line-height:1.2;height:30px;padding:2px 8px;border-width:1.5px}
textarea{font-size:16px;line-height:1.25;padding:4px 8px;min-height:38px}
#doctype{font-size:20px;height:34px;padding:2px 8px;margin:0 0 4px}
.f td{padding:2px 4px}.f td input{height:28px}
.meta label{margin-top:2px}.cl label{margin-bottom:1px}.grid{gap:6px}
.tot input{height:28px}
/* Fond coloré, champs blancs bordés */
:root{--bg:#a9cdb7;--paper:#cfe5d9;--line:#7fa892;--field:#fff}
input:not([type=checkbox]):not([type=range]):not([type=file]):not([type=radio]),textarea,select.f,.grid select{background:#fff;border:2px solid var(--acc)}
.sc textarea,.sc input,#hq,.ha .pp input{background:#fff;border:2px solid var(--acc)}
</style>
</head>
<body>
<div class="bar">
 <select id="cur" aria-label="Devise" hidden><option value="XOF">FCFA</option><option value="EUR">€ Euro</option><option value="USD">$ Dollar</option></select>
 <button id="tog">Paramètres</button>
 <button id="hist">Factures enregistrées</button>
 <button id="new">Nouvelle facture</button>
 <button id="prev" class="main">Aperçu et cachets</button>
 <button id="back" hidden>← Modifier la facture</button>
 <button id="sv" class="main" hidden>Enregistrer</button>
</div>
<div id="msg" role="status"></div>

<main class="sheet" id="invoice">
 <div class="top">
  <div style="flex:1;min-width:220px">
   <select id="doctype" class="f" aria-label="Type de document"><option>FACTURE</option><option>FACTURE PROFORMA</option><option>DEVIS</option><option>BON DE LIVRAISON</option></select>
   <div class="co" id="co"></div>
  </div>
  <div class="meta">
   <label for="num">N°</label><input id="num">
   <label for="date">Date</label><input id="date" type="date">
   <label for="status">Statut</label><select id="status" class="f"><option>En attente</option><option>Payé</option></select>
   <label for="by">Établi par</label><input id="by">
  </div>
 </div>
 <div class="cl">
  <label for="cl_name">Nom du client</label>
  <input id="cl_name">
  <label for="cl_addr">Adresse</label>
  <input id="cl_addr">
  <label for="cl_tel">Téléphone</label>
  <input id="cl_tel" type="tel">
 </div>
 <div class="scroll">
  <table class="f">
   <thead><tr><th class="rf">Réf</th><th>Désignation</th><th class="q">Qté</th><th class="p">Prix unitaire</th><th class="t">Total</th><th class="x"></th></tr></thead>
   <tbody id="rows"></tbody>
  </table>
 </div>
 <button class="add" id="add">+ Ajouter une ligne</button>
 <div class="tot">
  <span class="grand">Total à payer</span><span class="v grand" id="t_tot"></span>
  <span>Acompte versé <input id="acompte" type="number" min="0" step="any" aria-label="Acompte versé"></span><span class="v" id="t_ac"></span>
  <span>Solde dû</span><span class="v" id="t_so"></span>
 </div>
 <div class="cl" style="margin-bottom:0;max-width:none">
  <label id="paylbl">Paiement</label>
  <input id="pay" type="hidden">
  <div class="pb" id="paybtns" role="group" aria-labelledby="paylbl"></div>
 </div>
 <div class="notes">
  <label for="notes">Message en bas de facture</label>
  <textarea id="notes"></textarea>
 </div>
</main>

<section class="sheet" id="settings" hidden>
 <h2 class="sh">Paramètres de l’entreprise</h2>
 
 <div class="logobox">
  <div class="lp" id="lp">Aucun logo</div>
  <div>
   <input type="file" id="c_logo" accept="image/*" hidden>
   <button id="pick" class="main" type="button">Choisir un logo</button>
   <button id="rmlogo" type="button" hidden>Retirer</button>
  </div>
 </div>
 <div class="logobox">
  <div class="lp" id="sp">Aucune signature</div>
  <div>
   <b>Signature de l’entreprise</b>
   <input type="file" id="c_sign" accept="image/*" hidden>

  return{tot:tot,ac:ac,so:Math.max(0,tot-ac)};

 function renderHist(){

  list.forEach(function(r){

    hset(hget().filter(function(x){return x.f.num!==r.f.num}));renderHist();
